<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONIX — Connecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080810;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .logo { font-size: 2rem; font-weight: 800; letter-spacing: 4px;
      background: linear-gradient(135deg,#ff6b9d,#ff9a3c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,107,157,0.2);
      border-top-color: #ff6b9d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <script src="spotify.js"></script>
  <script src="config.js"></script>
  <div class="logo">SONIX</div>
  <div class="spinner"></div>
  <p>Connecting to Spotify...</p>
  <script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.querySelector('p').textContent = 'Auth failed: ' + error;
      return;
    }

    if (code) {
      try {
        // 🔥 CALL THIS (IMPORTANT)
        const success = await SpotifyAPI.handleCallback(code);

        if (success) {
          window.location.href = "index.html";
        } else {
          document.querySelector('p').textContent = 'Login failed';
        }
      } catch (err) {
        console.error(err);
        document.querySelector('p').textContent = 'Something went wrong';
      }
    }
  })();
</script>
</body>
</html>
