<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONIX — Connecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080810;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .logo { font-size: 2rem; font-weight: 800; letter-spacing: 4px;
      background: linear-gradient(135deg,#ff6b9d,#ff9a3c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,107,157,0.2);
      border-top-color: #ff6b9d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">SONIX</div>
  <div class="spinner"></div>
  <p>Connecting to Spotify...</p>
  <script>
    // Extract the authorization code from the URL
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.querySelector('p').textContent = 'Auth failed: ' + error;
    } else if (code) {
      // Store code and redirect back to main page
      sessionStorage.setItem('spotify_auth_code', code);
      window.location.href = 'index.html?spotify_code=' + code;
    }
  </script>
</body>
</html>
